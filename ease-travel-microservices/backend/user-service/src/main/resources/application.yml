server:
  port: 8081

spring:
  application:
    name: user-service
  config:
    import: aws-secretsmanager:${RDS_SECRET_ARN:arn:aws:secretsmanager:us-east-1:959713282924:secret:rds!db-ac3131f7-1993-4580-8828-1622ea790e84-ZF7csy}
  datasource:
    url: jdbc:mysql://${host}:${port}/${DB_NAME:easetravel_users}?useSSL=true&requireSSL=true&serverTimezone=UTC&createDatabaseIfNotExist=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${username}
    password: ${password}
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  cloud:
    aws:
      region:
        static: ${AWS_REGION:us-east-1}

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true

jwt:
  secret: easetravel-super-secret-key-for-jwt-signing-must-be-at-least-256-bits
  expiration: 86400000  # 24 hours in milliseconds

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.easetravel.user: DEBUG
    org.springframework.security: INFO

